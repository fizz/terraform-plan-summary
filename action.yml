name: Terraform plan summary
description: Posts Terraform plans as pull request comments and collects them into one summary table.
author: fizz
branding:
  icon: list
  color: purple

inputs:
  mode:
    description: >-
      "comment" posts one plan as a comment, or updates that plan's comment.
      "summary" builds the table from the plan comments. "pending" marks the table as
      out of date while new plans run.
    default: summary
  name:
    description: '"comment" mode: the plan name in the marker and the table, such as "prod".'
    default: ""
  plan-file:
    description: '"comment" mode: path to the text output of terraform plan.'
    default: ""
  max-plan-chars:
    description: >-
      "comment" mode: characters of plan output kept in the comment. A longer plan
      keeps its end, where the Plan: line and any errors are.
    default: "60000"
  title:
    description: Heading of the summary comment.
    default: Terraform plan summary
  marker-prefix:
    description: >-
      Plan comments start with <!-- PREFIX: NAME -->. The summary comment uses
      <!-- PREFIX-summary -->.
    default: tf-plan
  max-resources:
    description: Resources listed per plan before the rest collapse into a count.
    default: "20"
  backlinks:
    description: Add a link from each plan comment back to the summary.
    default: "true"
  github-token:
    description: Token that can read and write pull request comments.
    default: ${{ github.token }}

outputs:
  comment-url:
    description: URL of the comment that this step wrote.
    value: ${{ steps.run.outputs.comment-url }}

runs:
  using: composite
  steps:
    - id: run
      uses: actions/github-script@v9
      env:
        TPS_ACTION_PATH: ${{ github.action_path }}
        TPS_MODE: ${{ inputs.mode }}
        TPS_TITLE: ${{ inputs.title }}
        TPS_PREFIX: ${{ inputs.marker-prefix }}
        TPS_MAX_RESOURCES: ${{ inputs.max-resources }}
        TPS_BACKLINKS: ${{ inputs.backlinks }}
        TPS_NAME: ${{ inputs.name }}
        TPS_PLAN_FILE: ${{ inputs.plan-file }}
        TPS_MAX_PLAN_CHARS: ${{ inputs.max-plan-chars }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { main } = require(`${process.env.TPS_ACTION_PATH}/src/summary.js`);
          await main({
            github,
            context,
            core,
            inputs: {
              mode: process.env.TPS_MODE,
              title: process.env.TPS_TITLE,
              prefix: process.env.TPS_PREFIX,
              maxResources: process.env.TPS_MAX_RESOURCES,
              backlinks: process.env.TPS_BACKLINKS,
              name: process.env.TPS_NAME,
              planFile: process.env.TPS_PLAN_FILE,
              maxPlanChars: process.env.TPS_MAX_PLAN_CHARS,
            },
          });
